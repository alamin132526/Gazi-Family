
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>গাজী ফ্যামিলি</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f7f2;color:#183528;font-family:Arial,sans-serif}
header{background:#087a3d;color:white;text-align:center;padding:22px 10px}
header h1{margin:0 0 8px}
main{max-width:800px;margin:auto;padding:12px}
section{background:white;padding:15px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
h2{color:#087a3d;font-size:20px}
input,textarea{width:100%;padding:11px;margin:5px 0;border:1px solid #ccd8d0;border-radius:7px;font:inherit}
textarea{min-height:70px}
button{border:0;border-radius:7px;padding:10px;margin:4px 3px 4px 0;background:#087a3d;color:white;font-weight:bold}
.del{background:#b42318}.edit{background:#64756c}
.item{border:1px solid #ddd;padding:10px;margin:9px 0;border-radius:8px;overflow-wrap:anywhere}
.item p{white-space:pre-wrap}
small{color:#65756b}
</style>
</head>
<body>
<header>
<h1>👨‍👩‍👧‍👦 গাজী ফ্যামিলি</h1>
<p>পরিবারের তথ্য, পরিকল্পনা ও স্মৃতি</p>
<div id="status">সংযোগ হচ্ছে...</div>
</header>
<main id="app"></main>
<script>
const DB="https://gazi-family-default-rtdb.asia-southeast1.firebasedatabase.app";
const groups=[
{key:"members",title:"👥 সদস্য তালিকা",fields:[["name","সদস্যের নাম"],["phone","মোবাইল নম্বর"],["blood","রক্তের গ্রুপ"]]},
{key:"plans",title:"📌 পরিকল্পনা ও অনুষ্ঠান",fields:[["title","শিরোনাম"],["date","তারিখ"],["text","বিস্তারিত"]]},
{key:"events",title:"📷 ছবি ও ডকুমেন্ট",fields:[["title","শিরোনাম"],["date","তারিখ"],["text","বিস্তারিত"],["url","ছবি বা ডকুমেন্টের লিংক"]]},
{key:"notes",title:"📝 অন্যান্য তথ্য ও ঘোষণা",fields:[["title","শিরোনাম"],["text","বিস্তারিত"]]}
];
let records={},editing=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path,method="GET",data){
 const r=await fetch(DB+"/"+path+".json",{method,headers:{"Content-Type":"application/json"},body:data===undefined?undefined:JSON.stringify(data)});
 if(!r.ok)throw Error("ডেটাবেসে সমস্যা: "+r.status);
 return r.json();
}
function draw(){
 const app=document.getElementById("app");
 app.innerHTML=groups.map(g=>{
 const old=editing&&editing.group===g.key?records[g.key]?.[editing.id]:null;
 const form=g.fields.map(([k,label])=>
 k==="text"?`<textarea id="${g.key}_${k}" placeholder="${esc(label)}">${esc(old?.[k]||"")}</textarea>`:
 `<input id="${g.key}_${k}" placeholder="${esc(label)}" value="${esc(old?.[k]||"")}">`
 ).join("");
 const list=Object.entries(records[g.key]||{}).reverse().map(([id,d])=>
 `<div class="item"><b>${esc(d.name||d.title||"তথ্য")}</b>${
 g.fields.filter(f=>f[0]!=="name"&&d[f[0]]).map(([k,l])=>
 k==="url"?`<p>${esc(l)}: <a href="${esc(d[k])}" target="_blank" rel="noopener">লিংক খুলুন</a></p>`:
 `<p><b>${esc(l)}:</b> ${esc(d[k])}</p>`).join("")
 }<button class="edit" onclick="editItem('${g.key}','${id}')">✏️ Edit</button><button class="del" onclick="delItem('${g.key}','${id}')">🗑 Delete</button></div>`
 ).join("");
 return `<section><h2>${g.title}</h2><div><small>নতুন তথ্য যোগ করুন অথবা পুরোনো তথ্য এডিট করুন।</small></div>${form}<button onclick="saveItem('${g.key}')">${old?"পরিবর্তন সংরক্ষণ":"＋ Add করুন"}</button>${old?'<button class="edit" onclick="cancelEdit()">বাতিল</button>':""}<hr>${list||"<small>এখনো কোনো তথ্য যোগ করা হয়নি।</small>"}</section>`;
 }).join("");
}
async function refresh(){
 try{
 const data=await Promise.all(groups.map(g=>api(g.key)));
 groups.forEach((g,i)=>records[g.key]=data[i]||{});
 document.getElementById("status").textContent="✅ ডেটাবেস সংযুক্ত";
 draw();
 }catch(e){document.getElementById("status").textContent="সংযোগ হয়নি: "+e.message}
}
async function saveItem(k){
 try{
 const g=groups.find(x=>x.key===k),d={};
 g.fields.forEach(([f])=>d[f]=document.getElementById(k+"_"+f).value.trim());
 if(!d[g.fields[0][0]])return alert("প্রথম ঘরটি পূরণ করুন।");
 if(editing&&editing.group===k)await api(k+"/"+editing.id,"PATCH",d);
 else await api(k,"POST",d);
 editing=null;await refresh();alert("তথ্য সংরক্ষণ হয়েছে।");
 }catch(e){alert("সংরক্ষণ হয়নি। Firebase Rules ও ইন্টারনেট পরীক্ষা করুন। "+e.message)}
}
function editItem(k,id){editing={group:k,id};draw();document.getElementById(k+"_name")?.focus();}
function cancelEdit(){editing=null;draw();}
async function delItem(k,id){
 if(!confirm("এই তথ্য মুছে ফেলবেন?"))return;
 try{await api(k+"/"+id,"DELETE");editing=null;await refresh();}
 catch(e){alert("মুছতে সমস্যা হয়েছে: "+e.message)}
}
refresh();
setInterval(refresh,10000);
</script>
</body>
</html>
